<h1> Prevodník teplôt </h1>
<form method="post">
    {% csrf_token %}
    <label>Zadaj teplotu<input type = "number" name= "teplota" required></label>
    <select id = "hodnota" name = "hodnota">
    <option value="fahrenhait">°C → °F</option>
    <option value = "celsius">°F → °C</option>
    </select>
    <button> Preveď </button>
</form>

{% if vysledok != None%}
<p> Teplota bude {{vysledok}} {{hodnota}}</p>    
{%endif%}
