 {% extends "ulohy/base.html" %}
{% block titulok%}Súčet{%endblock%}
{% block obsah %}
<h1> Súčet dvoch čísel </h1>
<form method="post">
    {% csrf_token %}
    <label>Prvé číslo<input type = "number" name= "a" required></label>
    <br></br>
    <label>Druhé číslo<input type = "number" name= "b" required></label>
    <button> Vypočítaj </button>
</form>

{% if vysledok%}
<div class="alert alert-success" role="alert"> Výsledok bude {{vysledok}}</div>    
{%endif%}
{% endblock %}
